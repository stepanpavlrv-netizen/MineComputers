name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build
      - name: Test specs and computers without Minecraft
        run: |
          python3 tools/spectest/run.py
          COBALT=$(find ~/.gradle/caches -name "cobalt-*.jar" ! -name "*sources*" | head -1)
          echo "Cobalt: $COBALT"
          python3 tools/computer/run_test.py "$COBALT"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: minecomputers-jar
          path: build/libs/*.jar
